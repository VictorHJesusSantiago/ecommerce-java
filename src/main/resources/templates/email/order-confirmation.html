<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; }
        .header { background-color: #28a745; color: #ffffff; padding: 20px; text-align: center; }
        .content { padding: 30px; color: #333333; line-height: 1.6; }
        .order-table { width: 100%; border-collapse: collapse; margin: 20px 0; }
        .order-table th, .order-table td { padding: 10px; border-bottom: 1px solid #ddd; text-align: left; }
        .order-table th { background-color: #f8f9fa; }
        .total { font-weight: bold; font-size: 18px; text-align: right; padding: 15px 0; }
        .footer { background-color: #f4f4f4; padding: 20px; text-align: center; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Order Confirmation</h1>
    </div>
    <div class="content">
        <h2>Thank you for your order!</h2>
        <p>Your order <strong th:text="${orderNumber}">ORD-001</strong> has been confirmed.</p>
        <p>We'll send you updates as your order is processed and shipped.</p>

        <table class="order-table">
            <tr>
                <th>Order Number</th>
                <td th:text="${orderNumber}">ORD-001</td>
            </tr>
            <tr>
                <th>Order Date</th>
                <td th:text="${orderDate}">Date</td>
            </tr>
            <tr>
                <th>Status</th>
                <td>Pending</td>
            </tr>
        </table>

        <div class="total">
            <p>Thank you for shopping with us!</p>
        </div>
    </div>
    <div class="footer">
        <p>&copy; 2024 E-Commerce. All rights reserved.</p>
    </div>
</div>
</body>
</html>
