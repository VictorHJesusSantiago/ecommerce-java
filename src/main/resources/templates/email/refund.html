<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; }
        .header { background-color: #28a745; color: #ffffff; padding: 20px; text-align: center; }
        .content { padding: 30px; color: #333333; line-height: 1.6; }
        .refund-details { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin: 20px 0; }
        .footer { background-color: #f4f4f4; padding: 20px; text-align: center; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Refund Processed</h1>
    </div>
    <div class="content">
        <h2>Your refund has been processed</h2>
        <p>Your refund for order <strong th:text="${refundNumber}">REF-001</strong> has been processed.</p>

        <div class="refund-details">
            <p><strong>Refund Amount:</strong> <span th:text="${amount}">$0</span></p>
            <p><strong>Refund Number:</strong> <span th:text="${refundNumber}">REF-001</span></p>
        </div>

        <p>The refund will be reflected in your account within 5-10 business days depending on your bank.</p>
    </div>
    <div class="footer">
        <p>&copy; 2024 E-Commerce. All rights reserved.</p>
    </div>
</div>
</body>
</html>
