<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; }
        .header { background-color: #ffc107; color: #333333; padding: 20px; text-align: center; }
        .content { padding: 30px; color: #333333; line-height: 1.6; }
        .payment-details { background-color: #f8f9fa; border: 1px solid #dee2e6; border-radius: 8px; padding: 20px; margin: 20px 0; }
        .footer { background-color: #f4f4f4; padding: 20px; text-align: center; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Payment Confirmed</h1>
    </div>
    <div class="content">
        <h2>Payment Successful!</h2>
        <p>We've received your payment for order <strong th:text="${orderNumber}">ORD-001</strong>.</p>

        <div class="payment-details">
            <p><strong>Amount Paid:</strong> <span th:text="${amount}">$0</span></p>
            <p><strong>Order Number:</strong> <span th:text="${orderNumber}">ORD-001</span></p>
        </div>

        <p>Thank you for your purchase! We're preparing your order for shipment.</p>
    </div>
    <div class="footer">
        <p>&copy; 2024 E-Commerce. All rights reserved.</p>
    </div>
</div>
</body>
</html>
