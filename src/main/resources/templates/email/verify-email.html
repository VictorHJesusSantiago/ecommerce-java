<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; margin: 0; padding: 0; background-color: #f4f4f4; }
        .container { max-width: 600px; margin: 0 auto; background-color: #ffffff; }
        .header { background-color: #6f42c1; color: #ffffff; padding: 20px; text-align: center; }
        .content { padding: 30px; color: #333333; line-height: 1.6; }
        .verify-btn { display: inline-block; padding: 12px 24px; background-color: #6f42c1; color: #ffffff; text-decoration: none; border-radius: 4px; margin: 20px 0; }
        .footer { background-color: #f4f4f4; padding: 20px; text-align: center; font-size: 12px; color: #999999; }
    </style>
</head>
<body>
<div class="container">
    <div class="header">
        <h1>Verify Your Email</h1>
    </div>
    <div class="content">
        <h2>Welcome!</h2>
        <p>Thank you for registering. Please verify your email address by clicking the button below:</p>
        <p style="text-align: center;">
            <a th:href="${verificationUrl}" class="verify-btn">Verify Email</a>
        </p>
        <p>If the button doesn't work, copy and paste this URL into your browser:</p>
        <p th:text="${verificationUrl}" style="word-break: break-all; color: #007bff;"></p>
    </div>
    <div class="footer">
        <p>&copy; 2024 E-Commerce. All rights reserved.</p>
    </div>
</div>
</body>
</html>
